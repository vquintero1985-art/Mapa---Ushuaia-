/* ==========================================================
   ESTILO GENERAL
========================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #08151d;
  color: #fff;
}

#app {
  height: 100vh;
  display: flex;
  overflow: hidden;
}


/* ==========================================================
   PANEL LATERAL
========================================================== */

.sidebar {

  width: 390px;
  min-width: 390px;

  background:
    linear-gradient(
      180deg,
      #09283a 0%,
      #0c3549 48%,
      #071a24 100%
    );

  overflow-y: auto;

  box-shadow:
    5px 0 20px rgba(0,0,0,.35);

  position: relative;
  z-index: 1000;
}


.sidebar-header {

  padding: 24px 22px 20px;

  background:
    linear-gradient(
      135deg,
      rgba(7,42,59,.98),
      rgba(11,76,96,.95)
    );

  border-bottom:
    3px solid #ff7a3c;
}


.sidebar-header h1 {

  margin: 0;

  font-size: 21px;

  line-height: 1.2;
}


.sidebar-header p {

  margin: 9px 0 0;

  color: #c8dfe8;

  font-size: 12px;

  line-height: 1.5;
}


/* ==========================================================
   FECHA
========================================================== */

.trip-date {

  margin-top: 14px;

  display: inline-block;

  background: #ff7a3c;

  padding: 6px 10px;

  border-radius: 20px;

  font-size: 11px;

  font-weight: bold;
}


/* ==========================================================
   BOTONES DE DÍAS
========================================================== */

.day-selector {

  padding: 15px;

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 6px;

  background: rgba(0,0,0,.15);
}


.day-button {

  border: 0;

  padding: 9px 4px;

  border-radius: 8px;

  background: rgba(255,255,255,.09);

  color: white;

  cursor: pointer;

  font-weight: bold;

  font-size: 11px;

  transition: .2s;
}


.day-button:hover {

  background:
    rgba(255,255,255,.18);
}


.day-button.active {

  background: #ff7a3c;

  box-shadow:
    0 2px 8px rgba(0,0,0,.3);
}


/* ==========================================================
   CONTENIDO DEL DÍA
========================================================== */

.day-content {

  padding: 18px;
}


.day-title {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 5px;
}


.day-icon {

  width: 42px;
  height: 42px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 21px;

  border: 2px solid white;

  box-shadow:
    0 2px 7px rgba(0,0,0,.35);
}


.day-title h2 {

  margin: 0;

  font-size: 18px;
}


.day-subtitle {

  color: #c8dfe8;

  font-size: 12px;

  margin-bottom: 16px;
}


/* ==========================================================
   TARJETAS DE ITINERARIO
========================================================== */

.timeline {

  position: relative;

  margin-top: 12px;
}


.timeline::before {

  content: "";

  position: absolute;

  left: 43px;

  top: 10px;

  bottom: 10px;

  width: 2px;

  background:
    rgba(255,255,255,.2);
}


.timeline-item {

  position: relative;

  display: grid;

  grid-template-columns:
    62px 1fr;

  gap: 10px;

  margin-bottom: 13px;
}


.timeline-time {

  color: #ffb08b;

  font-size: 11px;

  font-weight: bold;

  text-align: right;

  padding-top: 4px;
}


.timeline-card {

  background:
    rgba(255,255,255,.075);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 9px;

  padding: 10px 11px;

  cursor: pointer;

  transition: .2s;
}


.timeline-card:hover {

  background:
    rgba(255,255,255,.13);

  transform:
    translateX(2px);
}


.timeline-card strong {

  display: block;

  font-size: 12px;

  margin-bottom: 4px;
}


.timeline-card span {

  display: block;

  color: #bdd4dd;

  font-size: 10.5px;

  line-height: 1.45;
}

   FICHA DE ACTIVIDAD
========================================================== */

.activity-box {

  padding: 13px;

  background:

  font-size: 11px;

  color: #0a5069;

  font-weight: bold;

========================================================== */

  background:

  padding: 12px 14px;

  border-radius: 10px;

/* ==========================================================

========================================================== */

.map-control {

/* ==========================================================
   RESPONSIVE
========================================================== */

@media(max-width: 850px) {

  #app {

    padding: 13px 16px;

function createIcon(
  emoji,
  color
) {

  return L.divIcon({

    className: "",

    html: `

      <div
        class="map-marker"
        style="background:${color}"
      >
        ${emoji}
      </div>

    `,

    iconSize: [
      38,
      38
    ],

    iconAnchor: [
      19,
      19
    ]

  });

}


/* ==========================================================
   POPUP
========================================================== */

function popup(
  day,
  title,
  text
) {

  return `

    <div
      class="popup-day"
      style="background:${days[day].color}"
    >

      DÍA ${day}

    </div>

    <div class="popup-title">

      ${title}

    </div>

    <div>

      ${text}

    </div>

  `;

}


/* ==========================================================
   MARCADORES DEL CIRCUITO
========================================================== */

function addMarker(
  day,
  coords,
  emoji,
  title,
  text
) {

  const marker =
    L.marker(

      coords,

      {
        icon:
          createIcon(
            emoji,
            days[day].color
          )
      }

    );


  marker
    .bindPopup(
      popup(
        day,
        title,
        text
      )
    );


  marker.addTo(
    routeLayers[day]
  );


  return marker;

}

/* ==========================================================
   RUTAS TERRESTRES
========================================================== */

function roadRoute(
  day,
  points
) {

  const coordinates =
    points
      .map(
        p =>
          `${p[1]},${p[0]}`
      )
      .join(";");


  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    coordinates +
    "?overview=full&geometries=geojson";


  fetch(url)

    .then(
      response =>
        response.json()
    )

    .then(
      data => {

        if (
          !data.routes ||
          !data.routes.length
        ) return;


        const coords =
          data.routes[0]
            .geometry
            .coordinates
            .map(
              c => [
                c[1],
                c[0]
              ]
            );


        L.polyline(

          coords,

          {
            color: "#ffffff",
            weight: 8,
            opacity: .75
          }

        ).addTo(
          routeLayers[day]
        );


        L.polyline(

          coords,

          {
            color:
              days[day].color,

            weight: 5,

            opacity: .95
          }

        ).addTo(
          routeLayers[day]
        );

      }

    )

    .catch(
      error =>
        console.log(
          "Ruta no disponible",
          error
        )
    );

}

/* ==========================================================
   FUNCIÓN MOSTRAR DÍA
========================================================== */

function showDay(day) {


  /* botones */

  document
    .querySelectorAll(
      ".day-button"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      "btn" + day
    )
    .classList.add(
      "active"
    );


  /* contenido */

  const data =
    days[day];


  let html = `

    <div class="day-title">

      <div
        class="day-icon"
        style="
          background:${data.color}
        "
      >

        ${data.icon}

      </div>

      <h2>
        ${data.title}
      </h2>

    </div>


    <div class="day-subtitle">

      ${data.subtitle}

    </div>


    <div class="stats">

  `;


  data.stats.forEach(
    stat => {

      html += `

        <div class="stat">

          <b>
            ${stat[0]}
          </b>

          <span>
            ${stat[1]}
          </span>

        </div>

      `;

    }
  );


  html += `

    </div>


    <div class="activity-box">

      <h3>
        🌎 Concepto de la jornada
      </h3>

      <p>
        ${data.description}
      </p>

    </div>


    <div class="timeline">

  `;


  data.timeline.forEach(
    item => {

      html += `

        <div class="timeline-item">

          <div class="timeline-time">
            ${item[0]}
          </div>

          <div
            class="timeline-card"
            onclick="focusDayLocation(${day}, '${item[1]}')"
          >

            <strong>
              ${item[1]}
            </strong>

            <span>
              ${item[2]}
            </span>

          </div>

        </div>

      `;

    }
  );


  html += `

    </div>

  `;


  document
    .getElementById(
      "dayContent"
    )
    .innerHTML = html;


  /* mostrar solamente el día seleccionado */

  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    if (
      map.hasLayer(
        routeLayers[i]
      )
    ) {

      map.removeLayer(
        routeLayers[i]
      );

    }

  }


  routeLayers[day]
    .addTo(map);


  /* enfocar */

  focusDay(day);

}


/* ==========================================================
   ENFOCAR DÍA
========================================================== */

function focusDay(day) {

  const bounds =
    routeLayers[day]
      .getBounds();


  if (
    bounds.isValid()
  ) {

    map.fitBounds(
      bounds,
      {
        padding: [
          50,
          50
        ],
        maxZoom: 13
      }
    );

  }

}


/* ==========================================================
   CONTROL DE DÍA EN MAPA
========================================================== */

function focusDayLocation(
  day,
  title
) {

  /*
    El usuario puede hacer clic
    en las tarjetas del itinerario.
    El mapa se centra sobre el
    recorrido correspondiente.
  */

  focusDay(day);

}

========================================================== */

const allControl =
  L.control({

    position:
      "topleft"

  });


allControl.onAdd =
function() {

  const button =
    L.DomUtil.create(
      "button",
      "map-control"
    );


  button.innerHTML =
    "🗺️ Ver circuito completo";


  button.onclick =
  function() {

    const allBounds =
      L.latLngBounds([]);


    for (
      let i = 1;
      i <= 5;
      i++
    ) {

      const bounds =
        routeLayers[i]
          .getBounds();


      if (
        bounds.isValid()
      ) {

        allBounds.extend(
          bounds
        );

      }

    }


    allBounds.extend(
      locations.airport
    );


    allBounds.extend(
      locations.center
    );


    map.fitBounds(
      allBounds,
      {
        padding: [
          40,
          40
        ]
      }
    );

  };


  return button;

};


allControl.addTo(map);
